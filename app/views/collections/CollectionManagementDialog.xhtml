<vbox class="Form CollectionManagementDialog">
    <style>
        body .CollectionManagementDialog {
            overflow: hidden;
        }
        @collectionContainer > vbox[hover="true"] {
            outline: solid 2px fadeout(@selected_bg, 30%);
            outline-offset: 0px;
        }

        @collectionContainer > vbox:hover {
            outline: solid 1px fadeout(@selected_bg, 40%);
            outline-offset: 0px;
        }

        @collectionContainer > vbox[dragged="true"] {
            outline: dashed 1px fadeout(@selected_bg, 40%);
            outline-offset: 0px;
        }

        @collectionContainer {
            flex-wrap: wrap;
            justify-content: space-between;
            overflow: auto;
            width: 50em;
            max-height: 60em;
            padding: 0em 1em 1em 0em;
        }
        @collectionContainer > .CollectionView {
            display: inline-flex;
            width: 21em;
            margin: 1em 0em 0em 1em;
            padding: 1em;
            box-shadow: @card_shadow;
            text-align: left;
            background-color: #FFF;
        }
        @collectionContainer > .CollectionView:not([visible="true"]) > * {
            opacity: 0.3;
        }
        @collectionContainer > .CollectionView:not([visible="true"]):hover > .Controls {
            opacity: 1;
        }
        @collectionContainer > .CollectionView i.Icon {
            @iconify();
            font-size: 2em;
        }
        @collectionContainer > .CollectionView .Name {
            padding-left: 0.5em;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @collectionContainer > .CollectionView .Name strong,
        @collectionContainer > .CollectionView .Name span {
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
            white-space: nowrap;
        }
        @collectionContainer > .CollectionView .Name span {
            opacity: 0.6;
            font-size: 0.9em;
        }
        @collectionContainer > button[selected="true"] {
            background-color: @selected_button_bg;
        }
        .CollectionView .Controls {
            padding-top: 1em;
            align-items: center;
            justify-content: flex-end;
        }
        .CollectionView .Controls .CollectionVersion {
            flex: 1;
            font-size: 0.85em;
            font-weight: 600;
            color: #777;
            margin-right: 0.5em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            user-select: none;
        }
        .CollectionView .Controls button {
            height: 1.8em;
            line-height: 1.8em;
            margin-left: 0.5em;
            padding-left: 0.2em;
            padding-right: 0.2em;
        }
        .CollectionView .Controls button:not(:hover),
        .CollectionView .Controls button[disabled] {
            border-color: transparent;
            background: none;
        }
        .info {
            align-self: center;
            padding-top: 2ex;
            color: #000;
            opacity: 0.5;
        }
        @searchPane {
            margin: 0em 1em 0.8em 1em;
            position: relative;
            align-items: center;
        }
        @searchPane i.searchIcon {
            @iconify();
            position: absolute;
            left: 0.8em;
            font-size: 1.3em;
            color: #888;
            pointer-events: none;
            z-index: 1;
        }
        @filterInput {
            width: 100%;
            padding-left: 2.6em;
            padding-right: 2.6em;
            background: #FFF;
            border: 1px solid #CCC;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        @clearSearchButton {
            position: absolute;
            right: 0.5em;
            top: 50%;
            transform: translateY(-50%);
            width: 1.8em;
            height: 1.8em;
            line-height: 1.8em;
            min-width: 0;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        @clearSearchButton:not(:hover) {
            border-color: transparent;
            background: transparent;
        }
        @clearSearchButton:hover {
            background: rgba(0, 0, 0, 0.08);
        }
        @clearSearchButton i {
            @iconify();
            font-size: 1.2em;
            color: #666;
            margin: 0;
            line-height: 1em;
        }
        @noResultsMessage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4em 1em;
            color: #888;
            text-align: center;
            width: 50em;
            box-sizing: border-box;
        }
        @noResultsMessage i.noResultsIcon {
            @iconify();
            font-size: 3em;
            opacity: 0.35;
            margin-bottom: 0.4em;
        }
        @noResultsMessage span {
            font-size: 1.1em;
            opacity: 0.8;
        }
    </style>
    <hbox anon-id="searchPane">
        <i class="searchIcon">search</i>
        <input anon-id="filterInput" type="text" placeholder="Search collection by name..." flex="1" />
        <button anon-id="clearSearchButton" style="display: none;" title="Clear search"><i>clear</i></button>
    </hbox>
    <hbox anon-id="collectionContainer" flex="1">
    </hbox>
    <vbox anon-id="noResultsMessage" style="display: none;" flex="1">
        <i class="noResultsIcon">search</i>
        <span>No collections found matching your search.</span>
    </vbox>
    <hbox anon-id="reorderInfo" class="info">
        (Drag and drop items to reorder)
    </hbox>
</vbox>

<vbox>
    <style>
        body .widget_CollectionPane {
            overflow: hidden;
        }

        @filter {
            position: relative;
        }
        @filter .fa-search {
            position: absolute;
            right: 1.5em;
            top: 50%;
            margin-top: -0.5em;
        }
        @filter @form {
            padding: 0.5em;
        }
        @filter @logo {
            display: none;
        }

        @filter @form input {
            line-height: 1.8;
            height: auto;
        }
        @contentPane {
            overflow: hidden;
        }
        @shapePane {
            background: @app_bg;
            overflow: auto;
        }
        @shapeListContainer {
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0em 0.5em 0.5em 0.5em;
        }
        .ShapeList {
            list-style: none;
            padding: 0em 0.5em;
            margin: 0px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-content: flex-start;
            overflow: auto;
            -webkit-flex-shrink: 0;
            -webkit-flex-basis: fill;
        }
        .ShapeList li {
            padding: 0px;
            display: block;
            margin: 0.2em 0em;
        }
        .ShapeList li .Shape {
            width: 3.8em;
            padding: 0.5em;
            box-sizing: content-box;
            color: #333;
            cursor: default;
        }
        .ShapeList li .Shape:hover {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 0.2em;
        }

        .ShapeList li .Shape .Icon {
            width: 3.8em;
            height: 3.8em;
            text-align: center;
        }
        .ShapeList li .Shape img {
            max-width: 3.4em;
            max-height: 3.4em;
            -webkit-filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.4));
        }

        .ShapeList li .Shape span {
            display: block;
        }
        .ShapeList li .Shape span {
            text-overflow: ellipsis;
            overflow: hidden;
            height: 2em;
            line-height: 1em;
            font-size: 0.85em;
            text-align: center;
            opacity: 0.5;
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.4);
            color: #000;
        }

        @collectionInfoPane {
            padding: 0.5em 0.5em 0em 0.5em;
            color: #000;
            overflow: hidden;
            align-items: center;
        }
        @selectorButton {
            display: flex;
            align-items: center;
            min-width: 0;
            height: auto;
            padding: 0.4em 0.5em;
            line-height: 1.3;
            text-align: left;
            white-space: normal;
            background: fadeout(#FFF, 60%);
            border-color: rgba(0, 0, 0, 0.12);
            color: #000;
        }
        @selectorButton:hover {
            background: fadeout(#FFF, 30%);
        }
        @selectorButton[expanded='true'] {
            border-color: darken(@selected_bg, 40%);
        }
        @selectorText {
            flex: 1;
            min-width: 0;
        }
        @collectionTitle {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @collectionDescription {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.55;
            font-size: 0.85em;
        }
        body .CollectionPickerRow .Description {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.55;
            font-size: 0.85em;
        }
        @selectorCaret {
            @iconify();
            flex: none;
            margin-left: 0.3em;
            opacity: 0.6;
        }
        @settingButton {
            flex: none;
            line-height: 1em;
            padding: 0 0.3em;
            height: 1.8em;
            margin-left: 0.3em;
        }
        @settingButton:not(:hover) {
            border-color: transparent;
            background: none;
        }

        /* Top crop of the collection's layout preview, as the old selector strip
           showed it; collections without a preview fall back to their icon. */
        body .CollectionThumb {
            flex: none;
            width: 3.4em;
            height: 2.6em;
            margin-right: 0.6em;
            border: solid 1px rgba(0, 0, 0, 0.15);
            background: #FAFAFA;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        body .CollectionThumb img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }
        body .CollectionThumb i {
            @iconify();
            font-size: 1.6em;
            color: rgba(0, 0, 0, 0.6);
        }

        @picker {
            display: none;
        }
        body .AnonId_popupContainer.CollectionPickerPopup {
            padding: 0em;
        }
        /* max-height is set in layoutPicker() so the list ends above the pane bottom;
           the list shrinks and scrolls inside it. */
        body @pickerContent {
            display: flex;
            flex-direction: column;
        }
        body @pickerFilter {
            padding: 0.5em;
            border-bottom: solid 1px rgba(0, 0, 0, 0.1);
        }
        body @pickerFilter input {
            width: 100%;
            line-height: 1.8;
            height: auto;
        }
        body @pickerHint {
            margin-top: 0.3em;
            font-size: 0.85em;
            opacity: 0.6;
        }
        body @pickerList {
            flex: 0 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 0.3em 0em;
        }
        body .CollectionPickerGroup {
            padding: 0.6em 0.8em 0.2em 0.8em;
            font-size: 0.75em;
            font-weight: bold;
            text-transform: uppercase;
            opacity: 0.55;
        }
        body .CollectionPickerRow {
            display: flex;
            align-items: center;
            padding: 0.4em 0.8em 0.4em 0.6em;
            border-left: solid 3px transparent;
            cursor: default;
        }
        body .CollectionPickerRow:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        body .CollectionPickerRow[highlighted='true'] {
            background: @selected_bg;
            color: @selected_fg;
        }
        body .CollectionPickerRow[highlighted='true'] .Description {
            opacity: 0.85;
        }
        body .CollectionPickerRow[highlighted='true'] .Name mark {
            color: #000;
        }
        body .CollectionPickerRow[current='true'] {
            border-left-color: darken(@selected_bg, 40%);
        }
        body .CollectionPickerRow .Text {
            flex: 1;
            min-width: 0;
        }
        body .CollectionPickerRow .Name {
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        body .CollectionPickerRow .Name mark {
            background: #FFE58F;
            color: inherit;
        }
        body .CollectionPickerEmpty {
            padding: 1em 0.8em;
            opacity: 0.6;
        }
        body @pickerFooter {
            display: flex;
            align-items: center;
            padding: 0.5em;
            border-top: solid 1px rgba(0, 0, 0, 0.1);
        }

        @textContainer {
            width: 100%;
            position: inherit;
        }
        @textContainer > input {
            width: 100%
        }
        @clearTextButton {
            position: absolute;
            right: 0.7em;
            top: 0.7em;
            line-height: 1em;
            height: 1.5em;
            width: auto;
            background: #c6e4ff;
        }
        @clearTextButton:not(:hover) {
            border-color: transparent;
            background: none;
        }
        @searchButton {
            margin-left: 0.5em;
        }
        @collectionLayoutContainer > * {
            transform-origin: 0 0;
        }
        @collectionLayoutContainer *[draggable] {
            opacity: 0;
        }
        @collectionLayoutContainer *[draggable][matched='true'] {
            opacity: 1;
            outline: solid 1px rgba(255, 0, 0, 0.6);
            outline-offset: 3px;
        }
        @collectionLayoutContainer *[draggable]:hover {
            /* Local highlight only: effects that change the whole layout (veils,
               spotlights) flash on every hotspot boundary the pointer crosses. */
            opacity: 1;
            cursor: pointer;
            background-color: fadeout(@selected_bg, 92%);
            outline: solid 1px fadeout(@selected_bg, 50%);
            outline-offset: 0px;
        }
    </style>
    <hbox anon-id="collectionInfoPane">
        <button anon-id="selectorButton" flex="1">
            <div anon-id="selectorThumb" class="CollectionThumb"></div>
            <div anon-id="selectorText">
                <strong anon-id="collectionTitle"></strong>
                <span anon-id="collectionDescription"></span>
            </div>
            <i anon-id="selectorCaret">arrow_drop_down</i>
        </button>
        <button anon-id="settingButton"><i>settings</i></button>
    </hbox>
    <hbox anon-id="filter">
        <hbox anon-id="logo">
        </hbox>
        <hbox flex="1" anon-id="form">
            <hbox flex="1">
                <div anon-id="textContainer">
                    <input type="text" flex="1" class="form-control" placeholder="Search for shapes" anon-id="searchInput"/>
                    <button anon-id="clearTextButton" style="display:none"><i>clear</i></button>
                </div>
            </hbox>
        </hbox>
    </hbox>
    <hbox flex="1" anon-id="contentPane">
        <vbox anon-id="shapePane" flex="1">
            <vbox flex="1" anon-id="shapeListContainer">
                <div anon-id="collectionLayoutContainer"></div>
                <ul anon-id="shapeList" class="ShapeList" flex="1">
                </ul>
            </vbox>
            <ui:Popup anon-id="picker">
                <div anon-id="pickerContent">
                    <div anon-id="pickerFilter">
                        <input type="text" class="form-control" placeholder="Find a collection" anon-id="pickerFilterInput"/>
                        <div anon-id="pickerHint"></div>
                    </div>
                    <div anon-id="pickerList"></div>
                    <div anon-id="pickerFooter">
                        <button anon-id="collectionManagementButton" title="Manage collections (F3)"><i>view_module</i><span>Manage collections...</span></button>
                    </div>
                </div>
            </ui:Popup>
        </vbox>
    </hbox>
</vbox>

<hbox>
    <style>
        body .NotificationPopup {
            border: @popup_border;
            border-radius: 0.35ex;
            background: #000;
            padding: 1em;
            box-shadow: 0em 0.15ex 2em rgba(0, 0, 0, 0.5);
            transition: opacity 0.4s;
            box-sizing: border-box;
            align-items: flex-start;
            color: #fff;
            max-width: 25em;
        }
        body .NotificationPopup i {
            @iconify();
            font-size: 1.5em;
            margin-right: 0.6em;
            color: #fff;
            opacity: 0.9;
            display: inline-block;
            font-family: 'Material Icons Original';
        }
        body .NotificationPopup @footer {
            margin-top: 1em;
            justify-content: flex-end;
        }
        body .NotificationPopup @messagePane {
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @this:not(.WithAction) @footer {
            display: none;
        }
    </style>
    <hbox anon-id="popupContainer" class="NotificationPopup">
        <i>info</i>
        <vbox flex="1">
            <span flex="1" anon-id="messagePane"></span>
            <hbox anon-id="footer">
                <button anon-id="secondaryButton" style="margin-right: 0.5em; display: none;"></button>
                <button anon-id="actionButton"></button>
            </hbox>
        </vbox>
    </hbox>
</hbox>
